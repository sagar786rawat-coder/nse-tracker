name: Update NSE EOD Sector & Theme Data

on:
  schedule:
    # 10:45 UTC = 4:15 PM IST, Monday to Friday
    - cron: '45 10 * * 1-5'
  workflow_dispatch: # Trigger manually anytime from the Actions tab

permissions:
  contents: write

jobs:
  fetch-eod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch NSE closing prices (28 symbols)
        run: python fetch_eod.py

      - name: Commit and push if updated (holiday-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eod_data.csv
          git diff --staged --quiet || (git commit -m "Update NSE EOD sector & theme data" && git push)
