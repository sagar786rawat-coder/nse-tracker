name: Update NSE Sector Data (Pre-Close & EOD)

on:
  schedule:
    # 3:00 PM IST (09:30 UTC) — pre-close snapshot ready by ~3:10-3:15 PM IST
    - cron: '30 9 * * 1-5'
    # 4:15 PM IST (10:45 UTC) — final official NSE closing prices
    - cron: '45 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-data-update
  cancel-in-progress: false

jobs:
  fetch-eod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch NSE prices
        run: python fetch_eod.py

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eod_data.csv last_updated.json
          if ! git diff --staged --quiet; then
            git commit -m "Update NSE sector data"
            git pull --rebase origin main
            git push
          fi
